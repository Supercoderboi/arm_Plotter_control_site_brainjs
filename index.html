<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCARA Wireless Controller</title>
    <!-- In-Browser Neural Network Engine -->
    <script src="https://unpkg.com/brain.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 15px; background: #121212; color: #fff; }
        .card { background: #1e1e1e; padding: 15px; border-radius: 10px; margin-bottom: 15px; }
        button { background: #007aff; color: #fff; border: none; padding: 12px 20px; font-size: 16px; border-radius: 8px; width: 100%; margin: 5px 0; cursor: pointer; }
        button:disabled { background: #444; }
        .btn-green { background: #34c759; }
        .btn-red { background: #ff3b30; }
        .btn-secondary { background: #5856d6; }
        input[type="number"], input[type="text"] { width: calc(100% - 22px); padding: 10px; margin: 5px 0; border-radius: 6px; border: 1px solid #333; background: #2c2c2c; color: #fff; font-size: 16px; }
        .row { display: flex; gap: 10px; }
        .status { font-weight: bold; color: #ff3b30; }
        .connected { color: #34c759; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #333; padding: 8px; text-align: center; }
        th { background: #2a2a2a; }
        td input { width: 90%; padding: 4px; margin: 0; }
        .prediction-box { background: #2a2a2a; border-left: 4px solid #007aff; padding: 10px; margin-top: 10px; border-radius: 4px; }
    </style>
</head>
<body>

    <h2>SCARA Wireless Plotter</h2>

    <!-- BLE Connection -->
    <div class="card">
        <div>Status: <span id="bleStatus" class="status">Disconnected</span></div>
        <button id="connectBtn" onclick="connectBLE()">Connect Bluetooth</button>
    </div>

    <!-- Manual Servo Control -->
    <div class="card">
        <h3>Manual Servo Control</h3>
        <label>Base Angle (0-180): <span id="baseVal">90</span>°</label>
        <input type="range" id="baseSlider" min="0" max="180" value="90" style="width: 100%;" oninput="handleSliderInput()">
        
        <label>Joint Angle (20-180): <span id="jointVal">45</span>°</label>
        <input type="range" id="jointSlider" min="20" max="180" value="45" style="width: 100%;" oninput="handleSliderInput()">

        <div class="row">
            <button onclick="togglePen(1)">Pen DOWN</button>
            <button onclick="togglePen(0)">Pen UP</button>
        </div>
    </div>

    <!-- Calibration Entry -->
    <div class="card">
        <h3>Add Calibration Point</h3>
        <div class="row">
            <input type="number" id="calX" placeholder="X (mm)">
            <input type="number" id="calY" placeholder="Y (mm)">
        </div>
        <button onclick="addPoint()">Add Current Servo Angles to List</button>
    </div>

    <!-- File Management & Dataset Table -->
    <div class="card">
        <h3>Manage Calibration Dataset</h3>
        
        <!-- Local Import/Export Controls -->
        <div class="row">
            <button onclick="exportJSON()" class="btn-secondary">Export JSON File</button>
            <button onclick="document.getElementById('importFile').click()" class="btn-secondary">Import JSON File</button>
            <input type="file" id="importFile" accept=".json" style="display:none;" onchange="importJSON(event)">
        </div>

        <div id="pointCount" style="margin-top: 10px;">Saved Points: 0</div>
        <div style="overflow-x:auto;">
            <table>
                <thead>
                    <tr>
                        <th>X (mm)</th>
                        <th>Y (mm)</th>
                        <th>Base (°)</th>
                        <th>Joint (°)</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="datasetTable">
                    <!-- Dynamic Table Rows -->
                </tbody>
            </table>
        </div>
        <button onclick="trainNetwork()" class="btn-green" style="margin-top: 15px;">Train Neural Net (Best of 20)</button>
    </div>

    <!-- Movement Target & Prediction Display -->
    <div class="card">
        <h3>Move to Cartesian (X, Y)</h3>
        <div class="row">
            <input type="number" id="targetX" placeholder="Target X (mm)">
            <input type="number" id="targetY" placeholder="Target Y (mm)">
        </div>
        <button onclick="moveToTarget()">Move via NN Model</button>

        <!-- Dynamic Output Readout -->
        <div id="predictionDisplay" class="prediction-box" style="display: none;">
            <strong>Target Position:</strong> X: <span id="outX">0</span> mm, Y: <span id="outY">0</span> mm<br>
            <strong>Calculated Angles:</strong> Base: <span id="outBase">0</span>°, Joint: <span id="outJoint">0</span>°
        </div>
    </div>

<script>
const SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
const CHARACTERISTIC_RX_UUID = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";

let rxCharacteristic = null;
let bleDevice = null;
let dataset = [];
let net = null;
let isTrained = false;
let currentPenState = 0;
let isSending = false;

// Global Min-Max Normalization Metadata
let normBounds = {
    minX: 0, maxX: 1,
    minY: 0, maxY: 1,
    minBase: 0, maxBase: 180,
    minJoint: 0, maxJoint: 180
};

// Load local dataset cache on launch
window.onload = function() {
    const cached = localStorage.getItem("scara_local_dataset");
    if (cached) {
        try {
            dataset = JSON.parse(cached);
            renderTable();
        } catch (e) {
            console.error("Error loading cached local dataset:", e);
        }
    }
};

function saveLocalCache() {
    localStorage.setItem("scara_local_dataset", JSON.stringify(dataset));
}

function exportJSON() {
    readTableData();
    if (dataset.length === 0) {
        alert("Calibration dataset is empty!");
        return;
    }
    const jsonStr = JSON.stringify(dataset, null, 2);
    const blob = new Blob([jsonStr], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `scara_calibration_${new Date().toISOString().slice(0, 10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
}

function importJSON(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
        try {
            const importedData = JSON.parse(e.target.result);
            if (Array.isArray(importedData)) {
                dataset = importedData;
                saveLocalCache();
                renderTable();
                alert("Calibration data imported successfully!");
            } else {
                alert("Invalid JSON format. Expected an array of coordinate objects.");
            }
        } catch (err) {
            alert("Error parsing JSON file: " + err.message);
        }
    };
    reader.readAsText(file);
    event.target.value = "";
}

function renderTable() {
    const tbody = document.getElementById("datasetTable");
    tbody.innerHTML = "";
    dataset.forEach((item, index) => {
        const row = document.createElement("tr");
        row.innerHTML = `
            <td><input type="number" value="${item.x}" onchange="updateRow(${index}, 'x', this.value)"></td>
            <td><input type="number" value="${item.y}" onchange="updateRow(${index}, 'y', this.value)"></td>
            <td><input type="number" value="${item.base}" onchange="updateRow(${index}, 'base', this.value)"></td>
            <td><input type="number" value="${item.joint}" onchange="updateRow(${index}, 'joint', this.value)"></td>
            <td><button onclick="deletePoint(${index})" class="btn-red" style="padding: 4px 8px; margin: 0;">X</button></td>
        `;
        tbody.appendChild(row);
    });
    document.getElementById("pointCount").innerText = `Saved Points: ${dataset.length}`;
}

function updateRow(index, key, val) {
    dataset[index][key] = parseFloat(val);
    saveLocalCache();
}

function addPoint() {
    const x = parseFloat(document.getElementById("calX").value);
    const y = parseFloat(document.getElementById("calY").value);
    const base = parseFloat(document.getElementById("baseSlider").value);
    const joint = parseFloat(document.getElementById("jointSlider").value);

    if (isNaN(x) || isNaN(y)) {
        alert("Enter valid X and Y coordinates in mm!");
        return;
    }

    dataset.push({ x: x, y: y, base: base, joint: joint });
    saveLocalCache();
    renderTable();
}

function deletePoint(index) {
    dataset.splice(index, 1);
    saveLocalCache();
    renderTable();
}

function readTableData() {
    const rows = document.querySelectorAll("#datasetTable tr");
    dataset = [];
    rows.forEach(row => {
        const inputs = row.querySelectorAll("input");
        if (inputs.length === 4) {
            dataset.push({
                x: parseFloat(inputs[0].value),
                y: parseFloat(inputs[1].value),
                base: parseFloat(inputs[2].value),
                joint: parseFloat(inputs[3].value)
            });
        }
    });
    saveLocalCache();
}

// Compute Dynamic Min-Max Normalization Limits
function updateNormalizationBounds() {
    const xVals = dataset.map(p => p.x);
    const yVals = dataset.map(p => p.y);
    const baseVals = dataset.map(p => p.base);
    const jointVals = dataset.map(p => p.joint);

    normBounds.minX = Math.min(...xVals);
    normBounds.maxX = Math.max(...xVals);
    normBounds.minY = Math.min(...yVals);
    normBounds.maxY = Math.max(...yVals);
    
    normBounds.minBase = Math.min(...baseVals);
    normBounds.maxBase = Math.max(...baseVals);
    normBounds.minJoint = Math.min(...jointVals);
    normBounds.maxJoint = Math.max(...jointVals);

    // Prevent divide-by-zero errors if min equals max
    if (normBounds.minX === normBounds.maxX) normBounds.maxX += 1;
    if (normBounds.minY === normBounds.maxY) normBounds.maxY += 1;
    if (normBounds.minBase === normBounds.maxBase) normBounds.maxBase += 1;
    if (normBounds.minJoint === normBounds.maxJoint) normBounds.maxJoint += 1;
}

// Multi-Run Ensemble Training (Best-of-20) with Dynamic Normalization
function trainNetwork() {
    readTableData();
    if (dataset.length < 3) {
        alert("Add at least 3-6 calibration points across your drawing area first!");
        return;
    }

    updateNormalizationBounds();

    // Map dataset dynamically onto [0, 1] range based on dataset limits
    const formattedData = dataset.map(p => ({
        input: { 
            x: (p.x - normBounds.minX) / (normBounds.maxX - normBounds.minX), 
            y: (p.y - normBounds.minY) / (normBounds.maxY - normBounds.minY) 
        },
        output: { 
            base: (p.base - normBounds.minBase) / (normBounds.maxBase - normBounds.minBase), 
            joint: (p.joint - normBounds.minJoint) / (normBounds.maxJoint - normBounds.minJoint) 
        }
    }));

    let bestNet = null;
    let lowestError = Infinity;
    const runs = 20;

    for (let i = 0; i < runs; i++) {
        let tempNet = new brain.NeuralNetwork({ 
            hiddenLayers: [12, 12],
            activation: 'leaky-relu'
        });

        let stats = tempNet.train(formattedData, { 
            iterations: 10000, 
            errorThresh: 0.0001,
            learningRate: 0.1
        });

        if (stats.error < lowestError) {
            lowestError = stats.error;
            bestNet = tempNet;
        }
    }

    net = bestNet;
    isTrained = true;
    alert(`Trained ${runs} models with Dynamic Min-Max scaling!\nBest model error: ${lowestError.toFixed(6)}`);
}

async function connectBLE() {
    try {
        bleDevice = await navigator.bluetooth.requestDevice({
            filters: [{ name: 'SCARA_Plotter' }],
            optionalServices: [SERVICE_UUID]
        });

        const server = await bleDevice.gatt.connect();
        const service = await server.getPrimaryService(SERVICE_UUID);
        rxCharacteristic = await service.getCharacteristic(CHARACTERISTIC_RX_UUID);

        document.getElementById("bleStatus").innerText = "Connected";
        document.getElementById("bleStatus").className = "status connected";
    } catch (error) {
        alert("BLE Error: " + error);
    }
}

async function sendPacket(base, joint, pen) {
    if (!rxCharacteristic) return;
    const encoder = new TextEncoder();
    const packet = `${base},${joint},${pen}\n`;
    await rxCharacteristic.writeValue(encoder.encode(packet));
}

// Live real-time slider handler
async function handleSliderInput() {
    const base = document.getElementById("baseSlider").value;
    const joint = document.getElementById("jointSlider").value;
    document.getElementById("baseVal").innerText = base;
    document.getElementById("jointVal").innerText = joint;

    if (isSending || !rxCharacteristic) return;

    try {
        isSending = true;
        await sendPacket(base, joint, currentPenState);
    } catch (err) {
        console.error("BLE Send Error:", err);
    } finally {
        isSending = false;
    }
}

function togglePen(state) {
    currentPenState = state;
    handleSliderInput();
}

function moveToTarget() {
    if (!isTrained || !net) {
        alert("Train the Neural Network model first!");
        return;
    }
    const tx = parseFloat(document.getElementById("targetX").value);
    const ty = parseFloat(document.getElementById("targetY").value);

    if (isNaN(tx) || isNaN(ty)) {
        alert("Please enter valid Target X and Y values!");
        return;
    }

    // Dynamic Normalization for Target Input
    const normX = (tx - normBounds.minX) / (normBounds.maxX - normBounds.minX);
    const normY = (ty - normBounds.minY) / (normBounds.maxY - normBounds.minY);

    // Run prediction
    const output = net.run({ x: normX, y: normY });

    // Reverse Min-Max Scaling to recover actual angles
    const predBase = Math.round(output.base * (normBounds.maxBase - normBounds.minBase) + normBounds.minBase);
    const predJoint = Math.round(output.joint * (normBounds.maxJoint - normBounds.minJoint) + normBounds.minJoint);

    // Update readout UI
    document.getElementById("outX").innerText = tx;
    document.getElementById("outY").innerText = ty;
    document.getElementById("outBase").innerText = predBase;
    document.getElementById("outJoint").innerText = predJoint;
    document.getElementById("predictionDisplay").style.display = "block";

    // Transmit over Bluetooth
    sendPacket(predBase, predJoint, currentPenState);
}
</script>
</body>
</html>
